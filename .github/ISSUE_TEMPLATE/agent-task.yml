name: Agent task
description: A delegated implementation task with an observable outcome, bounded scope, and exact verification commands.
title: "[agent-task] "
labels:
  - agent-task
body:
  - type: markdown
    attributes:
      value: |
        Use docs/development/pipeline.md for admission and execution. Complete this brief for one
        outcome; task/session restrictions override pipeline defaults. This form grants no security,
        evaluation or human-adoption authority. Use synthetic data only.

  - type: input
    id: outcome
    attributes:
      label: Observable outcome
      description: One sentence describing the behavior a reviewer can see. No plan or background.
    validations:
      required: true

  - type: textarea
    id: pointers
    attributes:
      label: Pointers
      description: >-
        Exact source, contract/spec and decision paths with status lines. For a test-only join of
        unchanged accepted-v1 seams, include the exercised sources and docs/development/synthetic-e2e.md.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: In-scope paths/behavior, permitted routine actions, exclusions and who owns publication.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: >-
        Observable checks; for behavior changes, name the RED-first case and test path. For
        serialization, include the writer-reader round trip and admitted byte extremes. Prose-only
        changes need document checks, not text-grep tests.
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: Invariants that must not change
      description: Security invariants, contract clauses and evaluation protocol rules that must hold.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Exact verification commands
      description: Exact commands in order, per-command caps and required receipts. Match checks to the changed surface.
    validations:
      required: true

  - type: textarea
    id: budget
    attributes:
      label: Delivery budget and retry policy
      description: >-
        State start/absolute UTC deadline (or no task deadline), validation/review/publication
        reserve, resource limits and pipeline-default or stricter retry/fallback policy. Setup,
        waits and recovery consume the same window; a deadline is not an estimate.
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites
      description: What must actually exist or be installed now. State "none" if nothing.
    validations:
      required: true

  - type: textarea
    id: gates
    attributes:
      label: Human gates and open decisions
      description: Decisions needing a human, their current status, and who may accept them. "None" if none.
    validations:
      required: true
